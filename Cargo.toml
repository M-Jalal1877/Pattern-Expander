[package]
name = "pattern-expander"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Pattern fill -> Expand -> Crop vector tool, in millimeters"

[lib]
name = "pattern_expander"
path = "src/lib.rs"

[[bin]]
name = "pattern-expander"
path = "src/main.rs"

[dependencies]
eframe = "0.37"
egui = "0.37"
geo = { version = "0.33", default-features = false, features = ["earcut"] }
# Stroke outlining (joins, caps, miter limit) for Flatten to Visible; already used by geo.
i_overlay = { version = "4.5", default-features = false }
# "rc": shared (Arc) geometry and groups serialize like plain values.
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
usvg = { version = "0.50.0", default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd = "0.18"

# Raw clipboard access (SVG / EMF vector data from Illustrator, CorelDRAW, …).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_UI_Input_KeyboardAndMouse",
] }

# Keep `cargo run` responsive: geometry is heavy, so optimise even debug builds.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
